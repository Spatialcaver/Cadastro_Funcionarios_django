<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Ponto Eletrônico do Colaborador</title>
    <style>
        /* CSS Básico para Centralizar */
        body { font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; background-color: #f4f4f4; }
        .container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 350px; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; margin-top: 10px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; transition: background-color 0.3s; }
        #login-btn { background-color: #007bff; color: white; }
        #ponto-btn { background-color: #28a745; color: white; display: none; } /* Inicialmente escondido */
        #logout-btn { background-color: #dc3545; color: white; display: none; margin-top: 5px; } /* Inicialmente escondido */
        #status { margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        
    
        <h2>Acesso Colaborador</h2>
        
        
        <div id="login-area">
            <input type="text" id="matricula" placeholder="Matrícula" required>
            <input type="password" id="senha" placeholder="Senha" required>
            <button id="login-btn">Fazer Login</button>
        </div>

        <div id="ponto-area">
            <div id="perfil-display" style="text-align: center; margin-bottom: 20px; display: none;">
            
            <p>Matrícula: <strong id="matricula-colaborador"></strong></p>
            <p><strong id="nome-colaborador"></strong></p>
        </div>
            <button id="ponto-btn">BATER PONTO</button>
            <button id="logout-btn">Sair</button>
        </div>

        <p id="status">Status: Aguardando Login</p>
    </div>

    <div id="meta-display" style="margin-top: 30px; border-top: 1px solid #ccc; padding-top: 20px;">
        
    </div>
    
    <script src="app.js"></script>
</body>
</html>
